[package]
name = "jinx-runtime"
description = "The runtime that Rust compiled from Nix by jinx links against"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
